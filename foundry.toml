[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "cancun"
via_ir = true
fs_permissions = [{ access = "read-write", path = "./deployments" }]
optimizer = true
optimizer_runs = 200

[fuzz]
runs = 256

[invariant]
runs = 256
depth = 30
fail_on_revert = false

[profile.ci.fuzz]
runs = 10000

[profile.ci.invariant]
runs = 1000
depth = 50

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
